name: Security & Vulnerability Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan

jobs:
  security-audit:
    name: Dependency & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Security Tools
        run: |
          pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST Security Scan
        run: |
          bandit -r backend/app -ll -ii

      - name: Run Zero-Secret Detection Check
        run: |
          python -c "
          import os, sys, re
          secret_patterns = [
              r'g' + r'hp_[A-Za-z0-9_]{36}',
              r'-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----',
              r'6448299ee7fb91c63cbc82511b435594',
              r'31925523',
              r'Admin@123456',
              r'reviewflow_password',
              r'postgresql://[a-zA-Z0-9_-]+:[^@\${\s]+@[a-zA-Z0-9_.-]+:\d+/[a-zA-Z0-9_]+'
          ]
          found = []
          for root, dirs, files in os.walk('.'):
              if any(skip in root for skip in ['.git', 'node_modules', '.github', 'tests']):
                  continue
              for f in files:
                  if f.endswith(('.py', '.js', '.jsx', '.json', '.yml', '.yaml', '.md')) and not f.startswith('.env'):
                      p = os.path.join(root, f)
                      try:
                          with open(p, 'r', encoding='utf-8', errors='ignore') as fh:
                              content = fh.read()
                              for pat in secret_patterns:
                                  if re.search(pat, content):
                                      found.append((p, pat))
                      except Exception:
                          pass
          if found:
              print('CRITICAL: Sensitive pattern found in production source files:', found)
              sys.exit(1)
          else:
              print('SUCCESS: Zero secrets detected across all tracked application source files!')
          "
